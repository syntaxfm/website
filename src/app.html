<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="shortcut icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="shortcut icon" href="/favicon.png" type="image/png" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<script>
			// The visitor's theme (ThemeMaker's `theme` cookie), applied before the first paint. The
			// server renders the same page for everyone, so it never reads the cookie.
			document.documentElement.classList.add(
				'theme-' + (/(?:^|;\s*)theme=([\w-]+)/.exec(document.cookie)?.[1] ?? 'system')
			);

			// Admins: keeps room for the admin menu, which arrives once the page's scripts have asked
			// who is signed in (lib/admin/admin_hint.ts)
			try {
				if (localStorage.getItem('is_admin') === '1') {
					document.documentElement.classList.add('is-admin');
				}
			} catch {
				// Site data is blocked, so nothing was remembered
			}
		</script>

		%syntax.analytics% %sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
