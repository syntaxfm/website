cases:
  - name: Share a timestamp and play it in a fresh listening session
    steps:
      - aiAct: Click the yellow episode Play button in the main content above Show Notes for episode 9999 (not the triangular play control in the bottom player). In the bottom player, pause playback, then click the forward 30 seconds control exactly twice. Leave playback paused.
      - media.remember: {}
      - aiAct: Open Share for this episode. Enable Start at timestamp, then click Link to copy the link. Do not edit the timestamp text field.
      - share.check: { timestamp: true }
      - share.open: {}
      - aiAct: Click the yellow episode Play button in the main content above Show Notes for episode 9999 (not the triangular play control in the bottom player).
      - media.check: { timestamp: true }
